body:
  - type: markdown
    attributes:
      value: |
        Suggest features and discuss improvements here. Maintainers can create linked implementation issues when an idea is ready to build.
        For help using KeyMove, use [Q&A](https://github.com/valentindimitrov/keymove/discussions/categories/q-a). Report reproducible defects through the [bug-report form](https://github.com/valentindimitrov/keymove/issues/new?template=bug_report.yml).
  - type: textarea
    id: idea
    attributes:
      label: What is your idea?
      description: Describe the task or problem and how KeyMove could help.
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: What would you like feedback on?
      description: Examples, tradeoffs, alternatives or questions for the community.
