name: Feature request
description: Propose a specific improvement to KeyMove.
title: '[Feature] '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. For early ideas or open-ended feedback, use [Ideas](https://github.com/valentindimitrov/keymove/discussions/categories/ideas).
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the task you are trying to complete and the current difficulty.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe how KeyMove should work, including an example if useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and context
      description: Workarounds, other approaches, browser limitations or related issues.
