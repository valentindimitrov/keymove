name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # A placeholder, never a real listing: it makes every build exercise the configured
      # Firefox ID path, which validate-builds.ts compares with the packaged manifest.
      WXT_FIREFOX_EXTENSION_ID: keymove-ci@keymove.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Set up verified pnpm
        uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run postinstall
      - run: pnpm quality
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:built
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: playwright-failure
          path: .artifacts/playwright/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
      # The deploy job below publishes these static files without installing or running
      # anything from this checkout.
      - run: pnpm website:build
      - name: Upload the website build
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: website
          path: .output/public/
          include-hidden-files: true # keeps .well-known/security.txt
          retention-days: 3
          if-no-files-found: error

  # Publishes the website to Cloudflare once the checks pass: main goes to production, pull
  # requests from this repository get a preview URL. Skipped until the CLOUDFLARE_ACCOUNT_ID
  # variable is set, for pull requests from forks, and for Dependabot, none of which receive
  # the token.
  #
  # The token-bearing steps run no code or configuration from the pull request: the build
  # arrives as an artifact, and Wrangler, its lockfile and wrangler.jsonc come from the base
  # commit (main). A pull request's own changes to those files take effect after merging.
  website:
    needs: quality
    if: >-
      vars.CLOUDFLARE_ACCOUNT_ID != '' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ github.event_name == 'push' && 'https://keymove.minddevops.eu' || steps.upload.outputs.url }}
    env:
      WRANGLER: website/deploy/node_modules/.bin/wrangler
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out trusted deployment configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions/setup-pnpm
            package.json
            pnpm-lock.yaml
            website/wrangler.jsonc
            website/deploy
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Set up verified pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Install the locked Wrangler only
        working-directory: website/deploy
        run: pnpm install --frozen-lockfile
      - name: Download the website build
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: website
          path: .output/public
      - name: Deploy to production
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: $WRANGLER deploy --config website/wrangler.jsonc
      - name: Upload a preview
        id: upload
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          ALIAS: pr-${{ github.event.pull_request.number }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          $WRANGLER versions upload --config website/wrangler.jsonc --preview-alias "$ALIAS" | tee upload.log
          url="$(grep -oE "https://$ALIAS-[a-z0-9.-]+\.workers\.dev" upload.log | head -n 1 || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: ${url:-see the upload log}" >> "$GITHUB_STEP_SUMMARY"
