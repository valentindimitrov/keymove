name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # A placeholder, never a real listing: it makes every build exercise the configured
      # Firefox ID path, which validate-builds.ts compares with the packaged manifest.
      WXT_FIREFOX_EXTENSION_ID: keymove-ci@keymove.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Set up verified pnpm
        uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run postinstall
      - run: pnpm quality
      - run: pnpm exec playwright install --with-deps chromium
      # The suite runs on a test build with open shadow roots, beside the production build.
      - run: pnpm build:chromium:test
      # Every installed-extension check, including the former CDP smoke scenarios.
      - name: Run the browser suite in bundled Chromium
        run: pnpm test:e2e:built
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure
          path: .artifacts/playwright/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
      # Static files only: the production deploy below and the Website preview workflow
      # (website-preview.yml) publish them without installing or running anything from them.
      - run: pnpm website:build
      - run: node website/verify-build.mjs
      - name: Upload the website build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website
          path: .output/public/
          include-hidden-files: true # keeps .well-known/security.txt
          retention-days: 3
          if-no-files-found: error

  # Deploys pushes to main to production once the checks pass. Skipped until the
  # CLOUDFLARE_ACCOUNT_ID variable is set. On a push to main this workflow file, the build and
  # this job's checkout are all main's, so the token meets only code already merged to main.
  #
  # Pull request previews are not uploaded here: in a pull_request run this file comes from the
  # pull request branch, which could rewrite any job holding the token. They run in
  # website-preview.yml, a workflow_run workflow whose definition always comes from main.
  website:
    needs: quality
    if: >-
      vars.CLOUDFLARE_ACCOUNT_ID != '' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://keymove.minddevops.eu
    env:
      WRANGLER: website/deploy/node_modules/.bin/wrangler
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out the deployment configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/setup-pnpm
            package.json
            pnpm-lock.yaml
            website/wrangler.jsonc
            website/deploy
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Set up verified pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Install the locked Wrangler only
        working-directory: website/deploy
        run: pnpm install --frozen-lockfile
      - name: Download the website build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website
          path: .output/public
      - name: Deploy to production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: $WRANGLER deploy --config website/wrangler.jsonc
