name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from package.json, without the leading v
        required: true
        type: string
      prerelease:
        description: Mark the draft as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Build draft release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      WXT_FIREFOX_EXTENSION_ID: ${{ vars.WXT_FIREFOX_EXTENSION_ID }}

    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node from package.json
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Validate release request
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_VERSION" != "$package_version" ]]; then
            echo "Requested version $RELEASE_VERSION does not match package.json version $package_version." >&2
            exit 1
          fi

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Version must contain two to four dot-separated numeric components." >&2
            exit 1
          fi

          if [[ -z "$WXT_FIREFOX_EXTENSION_ID" ]]; then
            echo "Set the WXT_FIREFOX_EXTENSION_ID repository variable before preparing a release." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The selected commit must be part of origin/main." >&2
            exit 1
          fi

          tag="v$RELEASE_VERSION"
          if git rev-parse --quiet --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists." >&2
            exit 1
          fi

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Run the full quality gate
        run: yarn quality

      - name: Package verified source
        run: yarn zip

      - name: Validate packaged builds
        run: yarn verify

      - name: Sign and verify Chromium upload
        env:
          KEYMOVE_CRX_PRIVATE_KEY: ${{ secrets.KEYMOVE_CRX_PRIVATE_KEY }}
        run: yarn sign:chrome

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail

          expected=(
            "keymove-v${RELEASE_VERSION}-chrome-mv3.zip"
            "keymove-v${RELEASE_VERSION}-chrome-mv3.crx"
            "keymove-v${RELEASE_VERSION}-firefox-mv3.zip"
            "keymove-v${RELEASE_VERSION}-safari-mv3.zip"
            "keymove-v${RELEASE_VERSION}-sources.zip"
          )

          for artifact in "${expected[@]}"; do
            if [[ ! -f ".output/$artifact" ]]; then
              echo "Expected release artifact is missing: $artifact" >&2
              exit 1
            fi
          done

          (
            cd .output
            sha256sum "${expected[@]}" > SHA256SUMS.txt
          )

      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="v$RELEASE_VERSION"
          release_args=(
            "$tag"
            --target "$GITHUB_SHA"
            --title "KeyMove $tag"
            --draft
            --generate-notes
            --fail-on-no-commits
          )

          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}" \
            ".output/keymove-v${RELEASE_VERSION}-chrome-mv3.zip#Chromium and Vivaldi" \
            ".output/keymove-v${RELEASE_VERSION}-chrome-mv3.crx#Signed Chrome Web Store upload" \
            ".output/keymove-v${RELEASE_VERSION}-firefox-mv3.zip#Firefox submission package" \
            ".output/keymove-v${RELEASE_VERSION}-safari-mv3.zip#Safari macOS web resources (runtime unverified; requires Apple packaging)" \
            ".output/keymove-v${RELEASE_VERSION}-sources.zip#Source package for Firefox review" \
            ".output/SHA256SUMS.txt#SHA-256 checksums"

          release_url="$(gh release view "$tag" --json url --jq .url)"
          {
            echo "### Draft release created"
            echo
            echo "Download and test the attached packages locally, then publish the draft manually."
            echo
            echo "$release_url"
          } >> "$GITHUB_STEP_SUMMARY"
