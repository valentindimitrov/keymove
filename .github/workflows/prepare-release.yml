name: Prepare release

# Builds and checks the packages in one job, then signs the Chromium upload and creates a
# draft release in a second job that runs only in the protected `release` environment.
# The signing key is an environment secret: a workflow edited on another branch cannot
# reach it, because the environment accepts deployments from `main` only and waits for a
# reviewer. Publishing the draft and every store upload remain manual (docs/crx-signing.md).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from package.json, without the leading v
        required: true
        type: string
      prerelease:
        description: Mark the draft as a prerelease
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      WXT_FIREFOX_EXTENSION_ID: ${{ vars.WXT_FIREFOX_EXTENSION_ID }}

    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node from package.json
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Validate release request
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_VERSION" != "$package_version" ]]; then
            echo "Requested version $RELEASE_VERSION does not match package.json version $package_version." >&2
            exit 1
          fi

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Version must contain two to four dot-separated numeric components." >&2
            exit 1
          fi

          if [[ -z "$WXT_FIREFOX_EXTENSION_ID" ]]; then
            echo "Set the WXT_FIREFOX_EXTENSION_ID repository variable before preparing a release." >&2
            exit 1
          fi

          # Fails early on a wrong selection. It is not the security boundary: the release
          # environment's branch rule is, because this file can be edited on any branch.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The selected commit must be part of origin/main." >&2
            exit 1
          fi

          tag="v$RELEASE_VERSION"
          if git rev-parse --quiet --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists." >&2
            exit 1
          fi

      - name: Set up verified pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm run postinstall

      - name: Run the full quality gate
        run: pnpm quality

      - name: Package verified source
        run: pnpm zip

      - name: Validate builds and packages
        run: |
          pnpm verify
          pnpm verify:packages

      - name: Upload unsigned packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-release-packages
          path: .output/keymove-v${{ inputs.version }}-*.zip
          if-no-files-found: error
          retention-days: 3

  sign:
    name: Sign and create draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
      WXT_FIREFOX_EXTENSION_ID: ${{ vars.WXT_FIREFOX_EXTENSION_ID }}

    # Nothing here installs packages or runs project build tooling. The scripts below import
    # only Node built-ins and src/extension_identity.ts, from a fresh checkout of the commit.
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node from package.json
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Recheck the release target
        shell: bash
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The selected commit must be part of origin/main." >&2
            exit 1
          fi
          if git rev-parse --quiet --verify "refs/tags/v$RELEASE_VERSION" >/dev/null; then
            echo "Tag v$RELEASE_VERSION already exists." >&2
            exit 1
          fi

      - name: Download unsigned packages
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: unsigned-release-packages
          path: .output

      - name: Revalidate downloaded packages
        run: node scripts/validate-builds.ts --packages

      - name: Sign and verify Chromium upload
        env:
          KEYMOVE_CRX_PRIVATE_KEY: ${{ secrets.KEYMOVE_CRX_PRIVATE_KEY }}
        run: node scripts/sign-chrome.ts

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail

          expected=(
            "keymove-v${RELEASE_VERSION}-chrome-mv3.zip"
            "keymove-v${RELEASE_VERSION}-chrome-mv3.crx"
            "keymove-v${RELEASE_VERSION}-firefox-mv3.zip"
            "keymove-v${RELEASE_VERSION}-safari-mv3.zip"
            "keymove-v${RELEASE_VERSION}-sources.zip"
          )

          for artifact in "${expected[@]}"; do
            if [[ ! -f ".output/$artifact" ]]; then
              echo "Expected release artifact is missing: $artifact" >&2
              exit 1
            fi
          done

          (
            cd .output
            sha256sum "${expected[@]}" > SHA256SUMS.txt
          )

      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="v$RELEASE_VERSION"
          release_args=(
            "$tag"
            --target "$GITHUB_SHA"
            --title "KeyMove $tag"
            --draft
            --generate-notes
            --fail-on-no-commits
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}" \
            ".output/keymove-v${RELEASE_VERSION}-chrome-mv3.zip#Chromium and Vivaldi" \
            ".output/keymove-v${RELEASE_VERSION}-chrome-mv3.crx#Signed Chrome Web Store upload" \
            ".output/keymove-v${RELEASE_VERSION}-firefox-mv3.zip#Firefox submission package" \
            ".output/keymove-v${RELEASE_VERSION}-safari-mv3.zip#Safari macOS web resources (runtime unverified; requires Apple packaging)" \
            ".output/keymove-v${RELEASE_VERSION}-sources.zip#Source package for Firefox review" \
            ".output/SHA256SUMS.txt#SHA-256 checksums"

          release_url="$(gh release view "$tag" --json url --jq .url)"
          {
            echo "### Draft release created"
            echo
            echo "Download and test the attached packages locally, then publish the draft manually."
            echo
            echo "$release_url"
          } >> "$GITHUB_STEP_SUMMARY"
