name: Publish to stores

# Submits the packages of a published GitHub release to the Chrome Web Store and Firefox
# Add-ons. The first job downloads and verifies the release assets without any secret. Each
# store job then runs in its own protected environment (`store-chrome`, `store-firefox`); both
# accept deployments from `main` only and wait for a reviewer, so a workflow edited on another
# branch cannot reach the store credentials. Store jobs install nothing: the script imports
# only Node built-ins and src/extension_identity.ts (docs/store-publishing.md).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published release version, without the leading v
        required: true
        type: string
      chrome:
        description: Submit to the Chrome Web Store
        required: true
        default: true
        type: boolean
      firefox:
        description: Submit to Firefox Add-ons
        required: true
        default: true
        type: boolean
      chrome_publish_type:
        description: Chrome Web Store, after review passes
        required: true
        default: publish-after-review
        type: choice
        options:
          - publish-after-review
          - stage-for-manual-publish

permissions: {}

concurrency:
  group: publish-stores
  cancel-in-progress: false

jobs:
  verify:
    name: Download and verify release packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SUBMIT_CHROME: ${{ inputs.chrome }}
      SUBMIT_FIREFOX: ${{ inputs.firefox }}
      WXT_FIREFOX_EXTENSION_ID: ${{ vars.WXT_FIREFOX_EXTENSION_ID }}

    steps:
      - name: Check out the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node from package.json
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Check the request and the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Version must contain two to four dot-separated numeric components." >&2
            exit 1
          fi
          if [[ "$SUBMIT_CHROME" != "true" && "$SUBMIT_FIREFOX" != "true" ]]; then
            echo "Select at least one store." >&2
            exit 1
          fi

          # Fails early on a wrong selection. The environments' branch rules are the boundary.
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run this workflow from main." >&2
            exit 1
          fi

          tag="v$RELEASE_VERSION"
          if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "false" ]]; then
            echo "Release $tag must exist and be published, not a draft." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "refs/tags/$tag^{commit}" origin/main; then
            echo "Tag $tag must point to a commit on origin/main." >&2
            exit 1
          fi

      - name: Download release packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir .output
          gh release download "v$RELEASE_VERSION" --dir .output
          (cd .output && sha256sum --check --strict SHA256SUMS.txt)

      - name: Verify packages
        run: node scripts/publish-stores.ts verify "$RELEASE_VERSION"

      - name: Hand packages to the store jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-packages
          path: |
            .output/keymove-v${{ inputs.version }}-chrome-mv3.crx
            .output/keymove-v${{ inputs.version }}-chrome-mv3.zip
            .output/keymove-v${{ inputs.version }}-firefox-mv3.zip
            .output/keymove-v${{ inputs.version }}-sources.zip
          if-no-files-found: error
          retention-days: 1

  chrome:
    name: Submit to the Chrome Web Store
    needs: verify
    if: inputs.chrome
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: store-chrome
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Check out the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node from package.json
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Download verified packages
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: store-packages
          path: .output

      - name: Upload and submit for review
        env:
          WXT_FIREFOX_EXTENSION_ID: ${{ vars.WXT_FIREFOX_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISH_TYPE: ${{ inputs.chrome_publish_type }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: node scripts/publish-stores.ts chrome "$RELEASE_VERSION"

  firefox:
    name: Submit to Firefox Add-ons
    needs: verify
    if: inputs.firefox
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: store-firefox
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Check out the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node from package.json
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Download verified packages
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: store-packages
          path: .output

      - name: Upload and submit for review
        env:
          WXT_FIREFOX_EXTENSION_ID: ${{ vars.WXT_FIREFOX_EXTENSION_ID }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/publish-stores.ts firefox "$RELEASE_VERSION"
