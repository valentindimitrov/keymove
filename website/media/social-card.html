<!doctype html>
<!-- Source of social-card.png, the link preview image (og:image). Same design as the store
     marquee tile in assets/store-listings/generate.mjs. To render it, see website/README.md. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 627px;
        overflow: hidden;
        position: relative;
        background:
          radial-gradient(ellipse at 92% 0%, #5e246c 0%, transparent 55%),
          radial-gradient(ellipse at 0% 100%, #302564 0%, transparent 58%),
          #151224;
        color: #fff;
        font-family: Arial, sans-serif;
      }
      .layout {
        height: 100%;
        display: flex;
        align-items: center;
        padding: 70px 90px;
        gap: 64px;
      }
      .logo {
        width: 200px;
        height: auto;
        filter: drop-shadow(0 12px 28px #cb38d63a);
      }
      h1 {
        font-size: 112px;
        letter-spacing: -2px;
        margin: 0;
        font-weight: 700;
      }
      .tag {
        font-size: 40px;
        color: #ded6ef;
        line-height: 1.3;
        margin: 14px 0 0;
      }
      .keys {
        display: flex;
        gap: 18px;
        margin-top: 36px;
      }
      kbd {
        font-family: Arial, sans-serif;
        font-size: 30px;
        border: 1px solid #817392;
        background: #ffffff0c;
        border-radius: 12px;
        padding: 16px 26px;
        box-shadow: 0 4px 0 #080713;
        color: #f1eafa;
      }
      .orb {
        position: absolute;
        right: -115px;
        top: -160px;
        width: 430px;
        height: 430px;
        border: 1px solid #df5fe52a;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div class="orb"></div>
    <div class="layout">
      <img class="logo" src="../../assets/logo-192.png" alt="" />
      <div>
        <h1>KeyMove</h1>
        <p class="tag">Find your way.<br />Keep your hands on the keys.</p>
        <div class="keys"><kbd>Alt + F</kbd><kbd>Tab</kbd><kbd>Enter</kbd></div>
      </div>
    </div>
  </body>
</html>
