<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Served with status 404 for any unknown address (not_found_handling in wrangler.jsonc). -->
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="../assets/logo-32.png" />
    <link rel="stylesheet" href="./website.css" />
    <link rel="stylesheet" href="./privacy.css" />
    <title>Page not found — KeyMove</title>
  </head>
  <body>
    <!-- Absolute links: this page is served at whatever depth the unknown address has. -->
    <main id="not-found" class="privacy-page wrap">
      <h1>Page not found</h1>
      <p class="privacy-lead">There is no KeyMove page at this address.</p>
      <p>
        Go to the <a href="/">KeyMove home page</a>, watch the
        <a href="/patterns">keyboard navigation examples</a>, or read
        <a href="/getting-started">how to get started</a>.
      </p>
    </main>
  </body>
